name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: BasaltCore
          path: |
            plugin/build/libs/BasaltCore-*.jar
            api/build/libs/basalt-api-*.jar
          if-no-files-found: error

  demo-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: BasaltCore
      - uses: actions/checkout@v7
        with:
          repository: basalt-lib/BasaltDemo
          ref: master
          path: BasaltDemo
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew :api:publishToMavenLocal
        working-directory: BasaltCore
      - run: ./gradlew build
        working-directory: BasaltDemo
